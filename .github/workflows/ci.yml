name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 离线测试（26 项）
        run: node test/run-tests.mjs
      - name: 语法检查
        run: |
          node --check lib/index.js
          node --check lib/client.js
          node --check tools/calibrate-prices.mjs
